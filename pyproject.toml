[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vhe"
version = "0.1.0"
description = "Local video highlight and search engine (Pipeline A, v1)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy<2",
    "torch==2.4.1",
    "transformers==4.51.3",
    "sentencepiece",
    "protobuf",
    "opencv-python-headless",
    "librosa",
    "soundfile",
    "faster-whisper",
    "silero-vad",
    # On-screen text. Its opencv-python requirement is overridden below ([tool.uv]).
    "rapidocr-onnxruntime==1.4.4",
    "onnxruntime",
    "pyclipper",
    "shapely",
]

[project.optional-dependencies]
# Lighthouse CG-DETR highlight scorer. NON-COMMERCIAL weights (trained on QVHighlights, CC BY-NC-SA).
# Install the package itself with --no-deps: its setup.py pins numpy<=1.23.5 and pulls gradio.
# torchaudio: Lighthouse imports it; install it from the same index as torch (CPU or CUDA build).
nc = ["torchaudio==2.4.1", "clip @ git+https://github.com/openai/CLIP.git", "easydict", "einops", "fvcore", "ftfy",
      "regex", "torchlibrosa", "ffmpeg-python", "pandas", "tqdm", "pyyaml", "scikit-learn"]
dev = ["pytest"]

[project.scripts]
vhe = "vhe.cli:main"

[tool.setuptools.packages.find]
include = ["vhe*"]

[tool.setuptools.package-data]
vhe = ["ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# rapidocr-onnxruntime requires opencv-python; opencv-python-headless above already provides cv2.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]
